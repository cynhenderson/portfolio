<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Fun Money</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-color: #111;
            --p1-color: #00ffff; /* Cyan */
            --p2-color: #ff00ff; /* Magenta */
            --text-color: #fff;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Press Start 2P', cursive;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            text-shadow: 2px 2px #444;
        }

        /* Container for Thor's Pixel Art Sprite */
        #mascot-container {
            height: 128px; /* Slightly larger to show off the art */
            width: 128px;
            margin: 0 auto 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #mascot-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            image-rendering: pixelated; /* Keeps the pixel art sharp */
        }

        .dashboard {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        @media (min-width: 600px) {
            .dashboard {
                flex-direction: row;
            }
        }

        .player-card {
            flex: 1;
            border: 4px solid #fff;
            padding: 20px;
            background: #000;
        }

        #p1-card { border-color: var(--p1-color); }
        #p2-card { border-color: var(--p2-color); }

        .player-name {
            font-size: 16px;
            margin-bottom: 20px;
        }

        #p1-card .player-name { color: var(--p1-color); }
        #p2-card .player-name { color: var(--p2-color); }

        .balance {
            font-size: 32px;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input[type="number"] {
            background: #222;
            border: 2px solid #fff;
            color: #fff;
            font-family: 'Press Start 2P', cursive;
            padding: 10px;
            font-size: 14px;
            text-align: center;
        }

        input[type="number"]::placeholder {
            color: #666;
        }

        button {
            background: #fff;
            color: #000;
            font-family: 'Press Start 2P', cursive;
            border: none;
            padding: 15px;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.1s;
        }

        button:active {
            transform: scale(0.95);
        }

        button:disabled {
            background: #444 !important;
            color: #888;
            cursor: not-allowed;
        }

        #p1-card button:not(:disabled) { background: var(--p1-color); }
        #p2-card button:not(:disabled) { background: var(--p2-color); }

        .log {
            margin-top: 30px;
            font-size: 10px;
            line-height: 1.5;
            color: #aaa;
            text-align: left;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .loading {
            font-size: 12px;
            color: yellow;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div id="mascot-container">
        <img src="/photos/Thor.png" alt="Thor the Cat">
    </div>

    <h1>INSERT COIN</h1>
    <div id="status" class="loading">CONNECTING TO SERVER...</div>

    <div class="dashboard">
        <div class="player-card" id="p1-card">
            <div class="player-name">P1: CYNTHIA</div>
            <div class="balance" id="p1-balance">$0.00</div>
            <div class="input-group">
                <input type="number" id="p1-input" placeholder="0.00" step="0.01" min="0">
                <button id="p1-btn" onclick="logExpense('Cynthia', 'p1-input')">SPEND</button>
            </div>
        </div>

        <div class="player-card" id="p2-card">
            <div class="player-name">P2: OSCAR</div>
            <div class="balance" id="p2-balance">$0.00</div>
            <div class="input-group">
                <input type="number" id="p2-input" placeholder="0.00" step="0.01" min="0">
                <button id="p2-btn" onclick="logExpense('Oscar', 'p2-input')">SPEND</button>
            </div>
        </div>
    </div>

    <div class="log" id="transaction-log">
        <p>RECENT SPENDS:</p>
        <ul id="log-list" style="list-style: none; padding: 0;"></ul>
    </div>

    <script>
        // Supabase Initialization
        const supabaseUrl = 'https://jwuptezmxpigfqlqdgqe.supabase.co';
        const supabaseKey = 'sb_publishable_YuSC4BH8X7m0XfShp8ml8g_uEUbnM3u';
        const db = window.supabase.createClient(supabaseUrl, supabaseKey);

        // Core App Logic
        const DAILY_ALLOWANCE = 20;
        const START_DATE = new Date('2026-06-01T00:00:00'); // Updated to June 1 experiment start

        function calculateTotalAllowance() {
            const today = new Date();
            
            // Future date safeguard
            if (today < START_DATE) {
                return 0;
            }

            // Calculate total days passed, counting day 1 as immediately funded
            const diffTime = today - START_DATE;
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24)) + 1;
            return diffDays * DAILY_ALLOWANCE;
        }

        async function fetchBalances() {
            document.getElementById('status').innerText = "SYNCING...";
            
            const totalAllowance = calculateTotalAllowance();
            const isAppActive = totalAllowance > 0;

            // Fetch all transactions, ignoring anything before the new start date
            const { data: transactions, error } = await db
                .from('transactions')
                .select('*')
                .gte('created_at', START_DATE.toISOString()) 
                .order('created_at', { ascending: false });

            if (error) {
                console.error(error);
                document.getElementById('status').innerText = "SYNC ERROR!";
                return;
            }

            let cynthiaSpent = 0;
            let oscarSpent = 0;

            const logList = document.getElementById('log-list');
            logList.innerHTML = ''; // Clear current logs

            transactions.forEach((t, index) => {
                if (t.user_name === 'Cynthia') cynthiaSpent += parseFloat(t.amount);
                if (t.user_name === 'Oscar') oscarSpent += parseFloat(t.amount);

                // Populate recent logs (limit to 5)
                if (index < 5) {
                    const li = document.createElement('li');
                    li.innerText = `> ${t.user_name} spent $${parseFloat(t.amount).toFixed(2)}`;
                    logList.appendChild(li);
                }
            });

            // Calculate current balances
            const cynthiaBalance = totalAllowance - cynthiaSpent;
            const oscarBalance = totalAllowance - oscarSpent;

            // Update DOM
            document.getElementById('p1-balance').innerText = `$${cynthiaBalance.toFixed(2)}`;
            document.getElementById('p2-balance').innerText = `$${oscarBalance.toFixed(2)}`;
            
            // Status Updates
            if (!isAppActive) {
                document.getElementById('status').innerText = "WAITING FOR START DATE...";
                document.getElementById('p1-btn').disabled = true;
                document.getElementById('p2-btn').disabled = true;
            } else {
                document.getElementById('status').innerText = "READY";
                document.getElementById('p1-btn').disabled = false;
                document.getElementById('p2-btn').disabled = false;
            }
        }

        async function logExpense(user, inputId) {
            const inputField = document.getElementById(inputId);
            const amount = parseFloat(inputField.value);

            if (isNaN(amount) || amount <= 0) {
                alert('ENTER VALID AMOUNT');
                return;
            }

            document.getElementById('status').innerText = "SAVING...";

            const { error } = await db
                .from('transactions')
                .insert([{ user_name: user, amount: amount }]);

            if (error) {
                console.error(error);
                document.getElementById('status').innerText = "SAVE ERROR!";
            } else {
                inputField.value = ''; // Clear the input
                fetchBalances(); // Refresh the screen
            }
        }

        // Initialize App on load
        window.onload = fetchBalances;

    </script>
</body>
</html>
